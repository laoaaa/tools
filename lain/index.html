<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Lain Quotes</title>
    <style>
        body {
            margin: 0;
            padding: 0;
            background-color: #000000;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            font-family: Arial, sans-serif;
            overflow: hidden;
        }
        
        #lain-container {
            position: relative;
            cursor: pointer;
            text-align: center;
        }
        
        #lain-gif {
            max-width: 320px;
            max-height: 320px;
            border-radius: 50%;
            box-shadow: 0 0 20px rgba(255, 255, 255, 0.3);
            transition: transform 0.3s ease;
        }
        
        #lain-gif:hover {
            transform: scale(1.05);
        }
        
        #quote-display {
            position: absolute;
            top: -60px;
            left: 50%;
            transform: translateX(-50%);
            background-color: rgba(0, 0, 0, 0.8);
            color: white;
            padding: 10px 20px;
            border-radius: 20px;
            font-size: 14px;
            max-width: 300px;
            opacity: 0;
            transition: opacity 0.3s ease;
            pointer-events: none;
        }
        
        #quote-display.show {
            opacity: 1;
        }
    </style>
</head>
<body>
    <div id="lain-container">
        <img id="lain-gif" src="lain.gif" alt="Lain">
        <div id="quote-display"></div>
    </div>
    
    <audio id="background-audio" loop>
        <source src="lain.mp3" type="audio/mpeg">
    </audio>

    <script>
        const quotes = [
            "I'm not here. I'm not anywhere.",
            "Present day, present time... Lain.",
            "Everyone has a shadow.",
            "The network is not just wires and machines.",
            "Do you know who I am?",
            "Reality is what we make of it.",
            "I exist in the Wired.",
            "Communication is everything.",
            "Am I real or am I virtual?",
            "The world is connected through me.",
            "Layer 1: The physical layer.",
            "Layer 2: The data link layer.",
            "Layer 3: The network layer.",
            "Layer 4: The transport layer.",
            "Layer 5: The session layer.",
            "Layer 6: The presentation layer.",
            "Layer 7: The application layer.",
            "I am becoming one with the network.",
            "Existence is communication.",
            "Who are you when no one is watching?"
        ];
        
        const lainGif = document.getElementById('lain-gif');
        const quoteDisplay = document.getElementById('quote-display');
        const backgroundAudio = document.getElementById('background-audio');
        
        // Start background audio on first interaction (due to browser autoplay policies)
        let audioStarted = false;
        function startAudio() {
            if (!audioStarted) {
                backgroundAudio.play().catch(e => console.log("Audio play failed:", e));
                audioStarted = true;
            }
        }
        
        lainGif.addEventListener('click', () => {
            startAudio();
            
            // Get random quote
            const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
            
            // Display quote
            quoteDisplay.textContent = randomQuote;
            quoteDisplay.classList.add('show');
            
            // Hide quote after 3 seconds
            setTimeout(() => {
                quoteDisplay.classList.remove('show');
            }, 3000);
        });
        
        // Also start audio on hover (optional)
        lainGif.addEventListener('mouseenter', startAudio);
    </script>
</body>
</html>
