<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>国内大模型聚合对话工具</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/styles/github-dark.min.css">
    <script src="https://cdnjs.cloudflare.com/ajax/libs/highlight.js/11.9.0/highlight.min.js"></script>
    <script src="https://cdnjs.cloudflare.com/ajax/libs/mammoth/1.6.0/mammoth.browser.min.js"></script>
    <style>
        .chat-container { height: calc(100vh - 220px); }
        .markdown-body pre { background: #1e1e1e; padding: 1rem; border-radius: 0.5rem; margin: 0.5rem 0; overflow-x: auto; }
        .thinking-block { background-color: #f0f7ff; border-left: 4px solid #3b82f6; padding: 0.75rem; margin-bottom: 1rem; font-size: 0.85rem; color: #4b5563; border-radius: 4px; }
        .img-preview { width: 60px; height: 60px; object-fit: cover; border-radius: 4px; border: 1px solid #ddd; }
    </style>
</head>
<body class="bg-gray-100 text-gray-900">

<div class="flex h-screen overflow-hidden">
    <aside class="w-80 bg-white border-r p-6 overflow-y-auto shrink-0 shadow-lg">
        <h2 class="text-xl font-bold mb-4 text-blue-600">模型设置</h2>
        
        <div class="space-y-4 text-sm">
            <div>
                <label class="block font-medium mb-1">选择服务商</label>
                <select id="provider" class="w-full border rounded px-3 py-2" onchange="applyPreset()">
                    <option value="deepseek">DeepSeek</option>
                    <option value="qwen">通义千问 (Qwen)</option>
                    <option value="kimi">Kimi (Moonshot)</option>
                    <option value="glm">智谱清言 (GLM)</option>
                    <option value="doubao">豆包 (Doubao)</option>
                    <option value="hunyuan">腾讯混元 (Hunyuan)</option>
                </select>
            </div>

            <div>
                <label class="block font-medium mb-1">API Key</label>
                <input id="apiKey" type="password" placeholder="sk-..." class="w-full border rounded px-3 py-2 focus:ring-2 focus:ring-blue-400 outline-none">
            </div>

            <div>
                <label class="block font-medium mb-1 italic text-gray-500">CORS 代理 (GitHub部署必备)</label>
                <input id="proxyUrl" type="text" placeholder="https://your-proxy.workers.dev/" class="w-full border rounded px-3 py-2 text-xs">
            </div>

            <hr>

            <div>
                <label class="block font-medium mb-1">API Endpoint / 模型 ID</label>
                <input id="endpoint" type="text" class="w-full border rounded px-3 py-2 mb-2 text-xs">
                <input id="modelId" type="text" class="w-full border rounded px-3 py-2 text-xs">
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block font-medium mb-1">温度</label>
                    <input id="temperature" type="number" step="0.1" value="0.7" class="w-full border rounded px-3 py-2">
                </div>
                <div>
                    <label class="block font-medium mb-1">Top-P</label>
                    <input id="topP" type="number" step="0.1" value="1.0" class="w-full border rounded px-3 py-2">
                </div>
            </div>

            <div class="grid grid-cols-2 gap-2">
                <div>
                    <label class="block font-medium mb-1">Max Tokens</label>
                    <input id="maxTokens" type="number" value="2048" class="w-full border rounded px-3 py-2">
                </div>
                <div>
                    <label class="block font-medium mb-1">上下文轮数</label>
                    <input id="contextCount" type="number" value="10" class="w-full border rounded px-3 py-2">
                </div>
            </div>

            <div class="flex items-center gap-2">
                <input id="enableThinking" type="checkbox" checked>
                <label for="enableThinking" class="font-medium">显示思考过程 (R1可用)</label>
            </div>

            <hr>

            <div>
                <label class="block font-medium mb-1 text-blue-600">系统提示词 (富文本编辑区)</label>
                <textarea id="systemPrompt" rows="5" class="w-full border rounded-lg px-3 py-2 text-xs shadow-inner focus:border-blue-500 outline-none bg-gray-50" placeholder="你是一个全能的助手..."></textarea>
            </div>
            
            <button onclick="clearChat()" class="w-full py-2 text-red-500 border border-red-200 rounded hover:bg-red-50 transition">清空本地历史</button>
        </div>
    </aside>

    <main class="flex-1 flex flex-col bg-white">
        <div id="chatHistory" class="chat-container overflow-y-auto p-6 space-y-6 flex-1"></div>

        <div id="filePreviewArea" class="px-6 flex gap-2 overflow-x-auto"></div>

        <div class="p-4 border-t bg-gray-50">
            <div class="max-w-5xl mx-auto">
                <div class="flex items-center gap-2 mb-2">
                    <button onclick="document.getElementById('fileInput').click()" class="text-gray-500 hover:text-blue-600" title="上传文档 (Word/TXT)">
                        📎 文档
                    </button>
                    <button onclick="document.getElementById('imageInput').click()" class="text-gray-500 hover:text-blue-600" title="上传图片">
                        🖼️ 图片
                    </button>
                    <input type="file" id="fileInput" class="hidden" accept=".txt,.doc,.docx" onchange="handleFileSelect(event)">
                    <input type="file" id="imageInput" class="hidden" accept="image/*" multiple onchange="handleImageSelect(event)">
                    <span id="uploadStatus" class="text-xs text-gray-400"></span>
                </div>
                
                <div class="relative">
                    <textarea id="userInput" rows="3" class="w-full border rounded-xl px-4 py-3 pr-24 shadow-sm focus:ring-2 focus:ring-blue-500 outline-none resize-none" placeholder="输入消息... (Shift+Enter 换行)"></textarea>
                    <button id="sendBtn" onclick="sendMessage()" class="absolute right-3 bottom-3 bg-blue-600 text-white px-6 py-2 rounded-lg hover:bg-blue-700 transition disabled:bg-gray-400">
                        发送
                    </button>
                </div>
            </div>
        </div>
    </main>
</div>

<script>
    const CONFIG_KEY = 'ai_aggregator_config';
    const presets = {
        deepseek: { url: 'https://api.deepseek.com/v1', model: 'deepseek-chat' },
        qwen: { url: 'https://dashscope.aliyuncs.com/compatible-mode/v1', model: 'qwen-max' },
        kimi: { url: 'https://api.moonshot.cn/v1', model: 'moonshot-v1-8k' },
        glm: { url: 'https://open.bigmodel.cn/api/paas/v4', model: 'glm-4' },
        doubao: { url: 'https://ark.cn-beijing.volces.com/api/v3', model: 'ep-换成你的推理端点' },
        hunyuan: { url: 'https://api.hunyuan.cloud.tencent.com/v1', model: 'hunyuan-standard' }
    };

    let chatMessages = []; // 用于上下文
    let selectedImages = []; // 存储Base64图片数据
    let fileText = ""; // 存储解析的文件文本

    // --- 初始化 & LocalStorage ---
    window.onload = () => {
        loadSettings();
        document.querySelectorAll('input, select, textarea').forEach(el => {
            el.addEventListener('change', saveSettings);
        });
    };

    function saveSettings() {
        const settings = {
            provider: document.getElementById('provider').value,
            apiKey: document.getElementById('apiKey').value,
            proxyUrl: document.getElementById('proxyUrl').value,
            endpoint: document.getElementById('endpoint').value,
            modelId: document.getElementById('modelId').value,
            temp: document.getElementById('temperature').value,
            topP: document.getElementById('topP').value,
            maxTokens: document.getElementById('maxTokens').value,
            contextCount: document.getElementById('contextCount').value,
            systemPrompt: document.getElementById('systemPrompt').value,
            enableThinking: document.getElementById('enableThinking').checked
        };
        localStorage.setItem(CONFIG_KEY, JSON.stringify(settings));
    }

    function loadSettings() {
        const saved = localStorage.getItem(CONFIG_KEY);
        if (saved) {
            const s = JSON.parse(saved);
            Object.keys(s).forEach(key => {
                const el = document.getElementById(key === 'temp' ? 'temperature' : key);
                if (el) {
                    if (el.type === 'checkbox') el.checked = s[key];
                    else el.value = s[key];
                }
            });
        } else {
            applyPreset();
        }
    }

    function applyPreset() {
        const p = document.getElementById('provider').value;
        document.getElementById('endpoint').value = presets[p].url;
        document.getElementById('modelId').value = presets[p].model;
        saveSettings();
    }

    // --- 文件处理 ---
    async function handleFileSelect(e) {
        const file = e.target.files[0];
        if (!file) return;
        
        document.getElementById('uploadStatus').innerText = "读取文件中...";
        
        if (file.name.endsWith('.docx')) {
            const reader = new FileReader();
            reader.onload = async (event) => {
                const result = await mammoth.extractRawText({ arrayBuffer: event.target.result });
                fileText += `\n[文件: ${file.name}]\n${result.value}\n`;
                updateFileUI(file.name);
            };
            reader.readAsArrayBuffer(file);
        } else {
            const reader = new FileReader();
            reader.onload = (event) => {
                fileText += `\n[文件: ${file.name}]\n${event.target.result}\n`;
                updateFileUI(file.name);
            };
            reader.readAsText(file);
        }
    }

    function handleImageSelect(e) {
        const files = Array.from(e.target.files);
        files.forEach(file => {
            const reader = new FileReader();
            reader.onload = (event) => {
                const base64 = event.target.result;
                selectedImages.push(base64);
                renderImagePreviews();
            };
            reader.readAsDataURL(file);
        });
    }

    function updateFileUI(name) {
        document.getElementById('uploadStatus').innerText = `已加载文档: ${name}`;
    }

    function renderImagePreviews() {
        const area = document.getElementById('filePreviewArea');
        area.innerHTML = selectedImages.map((src, index) => `
            <div class="relative group">
                <img src="${src}" class="img-preview shadow-md">
                <button onclick="removeImg(${index})" class="absolute -top-2 -right-2 bg-red-500 text-white rounded-full w-4 h-4 text-[10px] flex items-center justify-center opacity-0 group-hover:opacity-100">×</button>
            </div>
        `).join('');
    }

    function removeImg(index) {
        selectedImages.splice(index, 1);
        renderImagePreviews();
    }

    // --- 消息发送 ---
    async function sendMessage() {
        const input = document.getElementById('userInput');
        const text = input.value.trim();
        if (!text && selectedImages.length === 0 && !fileText) return;

        saveSettings();
        const apiKey = document.getElementById('apiKey').value;
        if (!apiKey) return alert('请先配置 API Key');

        // 构造当前发送内容
        let fullText = text;
        if (fileText) {
            fullText = `用户上传了文档，内容如下：\n${fileText}\n---\n用户的问题：${text}`;
        }

        appendUI('user', text || "发送了图片/文档");
        input.value = '';
        const currentImages = [...selectedImages]; // 拷贝当前选中的图片
        
        // 重置上传状态
        selectedImages = [];
        fileText = "";
        renderImagePreviews();
        document.getElementById('uploadStatus').innerText = "";

        const btn = document.getElementById('sendBtn');
        btn.disabled = true;

        try {
            let url = document.getElementById('endpoint').value + '/chat/completions';
            const proxy = document.getElementById('proxyUrl').value;
            if (proxy) url = proxy + url;

            // 构造符合 OpenAI 多模态格式的消息
            const userContent = [];
            userContent.push({ type: "text", text: fullText });
            currentImages.forEach(img => {
                userContent.push({
                    type: "image_url",
                    image_url: { url: img }
                });
            });

            const apiMsgs = [];
            const sys = document.getElementById('systemPrompt').value;
            if (sys) apiMsgs.push({ role: 'system', content: sys });
            
            const contextLimit = parseInt(document.getElementById('contextCount').value);
            const context = chatMessages.slice(-contextLimit);
            
            const body = {
                model: document.getElementById('modelId').value,
                messages: [...apiMsgs, ...context, { role: 'user', content: userContent }],
                temperature: parseFloat(document.getElementById('temperature').value),
                top_p: parseFloat(document.getElementById('topP').value),
                max_tokens: parseInt(document.getElementById('maxTokens').value)
            };

            const resp = await fetch(url, {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                    'Authorization': `Bearer ${apiKey}`
                },
                body: JSON.stringify(body)
            });

            const data = await resp.json();
            if (data.error) throw new Error(data.error.message);

            const result = data.choices[0].message;
            
            if (result.reasoning_content && document.getElementById('enableThinking').checked) {
                appendUI('assistant', result.reasoning_content, true);
            }
            appendUI('assistant', result.content);

            // 保存到对话上下文 (上下文不建议存图片，否则Token消耗极大，这里只存文本)
            chatMessages.push({ role: 'user', content: fullText });
            chatMessages.push({ role: 'assistant', content: result.content });

        } catch (e) {
            appendUI('system', '❌ 请求失败: ' + e.message);
        } finally {
            btn.disabled = false;
        }
    }

    function appendUI(role, content, isThinking = false) {
        const history = document.getElementById('chatHistory');
        const wrapper = document.createElement('div');
        wrapper.className = `flex ${role === 'user' ? 'justify-end' : 'justify-start'}`;
        
        const div = document.createElement('div');
        div.className = `max-w-[85%] px-4 py-3 rounded-2xl shadow-sm ${
            role === 'user' ? 'bg-blue-600 text-white' : 'bg-gray-100 text-gray-800'
        } ${isThinking ? 'thinking-block' : 'markdown-body'}`;

        div.innerHTML = isThinking ? `<strong>思维链：</strong><br>${content}` : marked.parse(content);
        
        wrapper.appendChild(div);
        history.appendChild(wrapper);
        history.scrollTop = history.scrollHeight;
        div.querySelectorAll('pre code').forEach(hljs.highlightElement);
    }

    function clearChat() {
        chatMessages = [];
        document.getElementById('chatHistory').innerHTML = "";
    }
</script>

</body>
</html>
